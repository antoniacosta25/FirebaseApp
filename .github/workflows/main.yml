
     name: Flutter Tests

on:
  workflow_dispatch:
  push:
    branches: [ "semana-4" ]
  pull_request:
    branches: [ "semana-4" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependências
        run: flutter pub get

      - name: Executar testes
        run: flutter test
