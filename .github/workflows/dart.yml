name: Testes Flutter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verificar Flutter
        run: flutter --version

      - name: Instalar dependências
        run: flutter pub get

      - name: Executar testes
        run: flutter test
